# [Instinct] Owner-managed GitHub secret stays in CI; prepare smoke/full dispatch and preserve failure evidence. No automatic dispatch or rerun.
name: S14 Groq cross-model
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke first; full only after smoke review and owner go-ahead'
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - full
permissions:
  contents: read
concurrency:
  group: s14-groq
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact workflow revision
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Save key-free preview
        shell: bash
        run: |
          set -euo pipefail
          node experiments/14-crossmodel-groq/scripts/groqhard-all-script.js > experiments/14-crossmodel-groq/results/groqhard-ci-preview.json
      - name: Run selected mode
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          S14_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ -z "$GROQ_API_KEY" ]]; then
            echo 'Missing repository secret GROQ_API_KEY.' >&2
            exit 1
          fi
          flags=(--run --approved-setup=f1d7f0ca492fb8c7cd33d6f07958769556f60793a59a360690eee4bfe63d708a)
          case "$S14_MODE" in
            smoke) flags+=(--smoke --batch=6) ;;
            full) flags+=(--batch=75) ;;
            *) echo 'Invalid mode.' >&2; exit 1 ;;
          esac
          node experiments/14-crossmodel-groq/scripts/groqhard-all-script.js "${flags[@]}" 2>&1 | tee "experiments/14-crossmodel-groq/results/groqhard-ci-${S14_MODE}.log"
      - name: Preserve evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s14-groq-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/14-crossmodel-groq/results/
          if-no-files-found: error
          retention-days: 30
