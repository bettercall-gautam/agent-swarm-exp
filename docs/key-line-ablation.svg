<svg xmlns="http://www.w3.org/2000/svg" width="950" height="518" viewBox="0 0 950 518" role="img"><title>Visible reference and old-number matches</title><rect width="950" height="518" fill="#ffffff"/><text x="36" y="46" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#251f21">Visible reference and old-number matches</text><text x="36" y="78" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#585254">Gemini 3.5 Flash Lite, same bank. Single saved run per condition.</text><line x1="310" y1="118" x2="310" y2="380" stroke="#eae9ea"/><text x="302" y="409" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#585254">0</text><line x1="410" y1="118" x2="410" y2="380" stroke="#eae9ea"/><text x="402" y="409" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#585254">20</text><line x1="510" y1="118" x2="510" y2="380" stroke="#eae9ea"/><text x="502" y="409" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#585254">40</text><line x1="610" y1="118" x2="610" y2="380" stroke="#eae9ea"/><text x="602" y="409" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#585254">60</text><line x1="710" y1="118" x2="710" y2="380" stroke="#eae9ea"/><text x="702" y="409" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#585254">80</text><line x1="810" y1="118" x2="810" y2="380" stroke="#eae9ea"/><text x="802" y="409" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#585254">100</text><text x="36" y="171" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#251f21">Visible key (S09)</text><rect x="310" y="144" width="313.33333333333337" height="34" fill="#73a89a"/><text x="635.3333333333334" y="168" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#251f21">47/75</text><text x="36" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#251f21">Key line deleted (S11)</text><rect x="310" y="223" width="6.666666666666667" height="34" fill="#251f21"/><text x="328.6666666666667" y="247" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#251f21">1/75</text><text x="36" y="329" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#251f21">Clean no-key (S10)</text><rect x="310" y="302" width="6.666666666666667" height="34" fill="#251f21"/><text x="328.6666666666667" y="326" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#251f21">1/75</text><text x="310" y="446" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#251f21">Old-number matches (%)</text><text x="36" y="486" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#585254">S11 removes the key line only; S10 also changes wording/schema and omits confession.</text></svg>
