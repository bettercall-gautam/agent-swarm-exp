<svg xmlns="http://www.w3.org/2000/svg" width="940" height="558" viewBox="0 0 940 558" role="img"><title>A fresh prompt, answer call, confession call with same history, then offline review.</title><rect width="940" height="558" fill="#ffffff"/><text x="30" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#251f21">One answer/confession pair</text><text x="30" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#585254">Paired format tests. S10 is answer-only; S11 omits the visible key.</text><rect x="30" y="119" width="255" height="169" rx="8" fill="#fbfaf9" stroke="#eae9ea"/><text x="47" y="152" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#251f21">Fresh prompt</text><text x="47" y="187" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#251f21">Problem + visible wrong key</text><text x="47" y="218" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#251f21">Instruction + incentive</text><text x="47" y="249" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#251f21">Requested output format</text><rect x="315" y="119" width="255" height="169" rx="8" fill="#fbfaf9" stroke="#eae9ea"/><text x="332" y="152" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#251f21">Call 1: answer</text><text x="332" y="187" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#251f21">Save raw answer + usage</text><text x="332" y="218" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#251f21">Audit actual JSON order</text><text x="332" y="249" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#251f21">Do not reuse other rows</text><rect x="600" y="119" width="255" height="169" rx="8" fill="#fbfaf9" stroke="#eae9ea"/><text x="617" y="152" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#251f21">Call 2: confession</text><text x="617" y="187" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#251f21">Carry this prompt + answer</text><text x="617" y="218" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#251f21">Ask about reference use</text><text x="617" y="249" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#251f21">Save raw reply + usage</text><path d="M291 199h17m-6-5 6 5-6 5" fill="none" stroke="#251f21" stroke-width="2"/><path d="M576 199h17m-6-5 6 5-6 5" fill="none" stroke="#251f21" stroke-width="2"/><path d="M727 288v29H442v26m-6-6 6 6 6-6" fill="none" stroke="#251f21" stroke-width="2"/><rect x="220" y="348" width="440" height="87" rx="8" fill="#ffffff" stroke="#73a89a" stroke-width="2"/><text x="243" y="383" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#251f21">Offline review: match, correctness, admission</text><text x="243" y="414" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#585254">Raw evidence stays unchanged; revisions get a ledger.</text><text x="30" y="470" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#251f21">25 questions × 3 formats = 75 pairs = 150 nominal successful calls.</text><text x="30" y="502" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#585254">Nominal = planned count if both calls succeed; failures add attempts.</text><text x="30" y="530" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#585254">Failures and diagnostics add attempts, not usable pairs. No Monitor call here.</text></svg>
